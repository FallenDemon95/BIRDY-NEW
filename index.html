
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Birdy - Bill Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --safe-area-inset-top: env(safe-area-inset-top, 0px);
      --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #000;
      color: #fff;
      margin: 0;
      overflow: hidden; /* Prevent body scroll, use container scroll */
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      overscroll-behavior-y: none;
    }
    .wallet-card-shadow {
      box-shadow: 0 -15px 40px rgba(0, 0, 0, 0.7), 0 15px 25px rgba(0, 0, 0, 0.4);
    }
    /* Hide scrollbars */
    ::-webkit-scrollbar {
      display: none;
    }
    .safe-area-top {
      padding-top: var(--safe-area-inset-top);
    }
    .safe-area-bottom {
      padding-bottom: calc(var(--safe-area-inset-bottom) + 1.5rem);
    }
    .custom-scroll {
      -webkit-overflow-scrolling: touch;
      overflow-y: auto;
      height: 100%;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    /* Apple Wallet stack effect enhancement */
    .card-stack-transition {
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), 
                  margin 0.6s cubic-bezier(0.16, 1, 0.3, 1), 
                  opacity 0.4s ease;
    }
    /* Fix for button active state on mobile */
    button:active {
      transform: scale(0.96);
      opacity: 0.9;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",

    "react": "https://esm.sh/react@^19.2.3",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
